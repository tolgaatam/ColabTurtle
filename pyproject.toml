[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ColabTurtle"
version = "2.2.0"
description = "An HTML based Turtle implementation, in order to work in Google Colab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tolga Atam", email = "atam@sabanciuniv.edu" }]
requires-python = ">=3.10"
# Loose lower bound on purpose: Colab and Jupyter already ship IPython,
# and pip does not upgrade an already-satisfied dependency.
dependencies = ["ipython>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tolgaatam/ColabTurtle"

[tool.hatch.build.targets.wheel]
packages = ["ColabTurtle"]

[tool.hatch.build.targets.sdist]
include = ["ColabTurtle", "README.md", "LICENSE"]
